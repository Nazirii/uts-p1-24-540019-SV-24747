name: CI-CD

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

jobs:
  # ---------------------------------------------------------------
  # Job 1: pengujian backend (php artisan test) - berjalan di semua branch & PR
  # ---------------------------------------------------------------
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_DATABASE: agenda_test
          MYSQL_USER: agenda
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: ${{ secrets.APP_KEY }}           # dari GitHub Secrets
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: agenda_test
      DB_USERNAME: agenda
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}   # dari GitHub Secrets
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, pdo_sqlite, mbstring, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependency
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env
        run: cp .env.example .env

      - name: Jalankan test
        run: php artisan test

  # ---------------------------------------------------------------
  # Job 2: build frontend (npm ci + npm run build) - berjalan di semua branch & PR
  # ---------------------------------------------------------------
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  # ---------------------------------------------------------------
  # Job 3: deploy - HANYA untuk push ke main.
  # PR, dev, dan branch fitur berhenti setelah job 1 & 2.
  # ---------------------------------------------------------------
  deploy:
    name: deploy
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nama image (huruf kecil)
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${OWNER}/${REPO}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${OWNER}/${REPO}-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image backend (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.img.outputs.backend }}:${{ github.sha }}

      - name: Build & push image frontend (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_URL=/api
          tags: ${{ steps.img.outputs.frontend }}:${{ github.sha }}
